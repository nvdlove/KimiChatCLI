[package]
name = "kimichat_cli_controller"
version = "0.1.0"
edition = "2024"
build = "build.rs"
description = "Windows controller that serves kimi.ai's browser chat to Kimi Code CLI as an OpenAI-compatible model provider"
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
serde_json = "1.0.151"
toml = "0.8"
tungstenite = { version = "0.24.0", default-features = false, features = [ "handshake" ] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
